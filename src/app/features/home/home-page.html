<section class="hero">
  <div class="hero__content">
    <h1 class="hero__name">{{ i18n.t().site.name }}</h1>
    <p class="hero__role">{{ i18n.t().home.hero.role }}</p>
    <p class="hero__intro">{{ i18n.t().home.hero.intro }}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" [routerLink]="['/', i18n.lang(), 'projects']">
        {{ i18n.t().home.hero.viewProjects }}
      </a>
      <a class="btn btn--secondary" [routerLink]="['/', i18n.lang(), 'contact']">
        {{ i18n.t().home.hero.contactMe }}
      </a>
    </div>
  </div>

  <figure class="hero__figure">
    <picture>
      <source
        type="image/webp"
        srcset="images/diea-portrait-480.webp 480w, images/diea-portrait-960.webp 960w"
        sizes="(min-width: 48rem) 22rem, 20rem"
      />
      <img
        class="hero__photo"
        src="images/diea-portrait-960.jpg"
        width="960"
        height="960"
        fetchpriority="high"
        [alt]="i18n.t().home.photo.alt"
      />
    </picture>
  </figure>
</section>

<app-skills-section />
